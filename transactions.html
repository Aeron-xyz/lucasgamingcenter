<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transactions - Lucas GAMING CENTER</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <a href="dashboard.html" class="navbar-brand">
            <div class="navbar-logo">L</div>
            <span>Lucas Gaming Center</span>
        </a>
        <div class="navbar-nav">
            <a href="dashboard.html" class="nav-link">Dashboard</a>
            <a href="transactions.html" class="nav-link active">Transactions</a>
            <a href="alerts.html" class="nav-link">Alerts</a>
            <a href="settings.html" class="nav-link">Settings</a>
            <button class="logout-btn" onclick="handleLogout()">Logout</button>
        </div>
    </nav>

    <div class="main-container">
        <h1 class="page-title">Transactions History</h1>

        <div class="filter-section">
            <div class="filter-group">
                <label for="from-date">From:</label>
                <input type="date" id="from-date" value="2024-04-01">
            </div>
            <div class="filter-group">
                <label for="to-date">To:</label>
                <input type="date" id="to-date" value="2024-04-15">
            </div>
            <button class="filter-btn" id="filter-btn">Filter</button>
        </div>

        <div class="card">
            <div class="table-container">
                <table id="transactions-table">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Transaction Type</th>
                            <th>Amount</th>
                            <th>Coins Dispensed</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Transactions will be loaded by JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
