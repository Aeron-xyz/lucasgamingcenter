<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Lucas GAMING CENTER</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <a href="dashboard.html" class="navbar-brand">
            <div class="navbar-logo">L</div>
            <span>Lucas Gaming Center</span>
        </a>
        <div class="navbar-nav">
            <a href="dashboard.html" class="nav-link active">Dashboard</a>
            <a href="transactions.html" class="nav-link">Transactions</a>
            <a href="alerts.html" class="nav-link">Alerts</a>
            <a href="settings.html" class="nav-link">Settings</a>
            <button class="logout-btn" onclick="handleLogout()">Logout</button>
        </div>
    </nav>

    <div class="main-container">
        <h1 class="page-title">Dashboard</h1>

        <div class="dashboard-grid">
            <div class="card">
                <div class="card-label">Total Transactions</div>
                <div class="card-value" id="total-transactions">676</div>
            </div>

            <div class="card">
                <div class="card-label">Total Coins Dispensed</div>
                <div class="card-value" id="total-coins">6,767 Coins</div>
            </div>

            <div class="card">
                <div class="card-label">Coins in Hopper</div>
                <div class="card-value" id="hopper-coins">0 Coins</div>
                <div class="coin-levels" id="coin-levels" style="display: none;">
                    <!-- Coin levels data stored here for calculation -->
                </div>
            </div>

            <div class="card">
                <div class="card-label">System Status</div>
                <div class="status-indicator">
                    <div class="status-dot"></div>
                    <span class="status-text">ONLINE</span>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-title">Recent Transactions</div>
            <div class="table-container">
                <table id="recent-transactions">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Type</th>
                            <th>Amount</th>
                            <th>Coins Dispensed</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Transactions will be loaded by JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
